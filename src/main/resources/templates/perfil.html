<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi perfil | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><a th:href="@{/panel}">Panel principal</a></header><main class="club-main profile-page"><p class="alert success" th:if="${exito}" th:text="${exito}"></p><p class="alert error" th:if="${error}" th:text="${error}"></p><section class="profile-card card">
<div class="profile-avatar profile-avatar-large"><img th:if="${usuario.fotoPerfil}" th:src="${usuario.fotoPerfil}" th:alt="${usuario.nombre}"><span th:unless="${usuario.fotoPerfil}">&#9673;</span></div>
<p class="eyebrow">Cuenta personal</p><h1 th:text="${usuario.nombre}">Nombre</h1><p class="profile-email" th:text="${usuario.email}">correo@uvg.edu.gt</p><p th:if="${usuario.descripcion}" th:text="${usuario.descripcion}"></p><span class="status-pill" th:text="${usuario.rol}">USUARIO</span>
<form class="profile-form" th:action="@{/perfil}" method="post" enctype="multipart/form-data"><label>Nombre<input type="text" name="nombre" th:value="${usuario.nombre}" required></label><label>Descripción <span>(opcional)</span><textarea name="descripcion" rows="3" th:text="${usuario.descripcion}"></textarea></label><label>Foto de perfil <span>(opcional)</span><input type="file" name="foto" accept="image/*"></label><button type="submit">Guardar cambios</button></form>
</section></main></body></html>
