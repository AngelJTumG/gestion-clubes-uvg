<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notificaciones | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><a th:href="@{/panel}">Panel principal</a></header><main class="club-main"><p class="eyebrow">Actualizaciones</p><h1>Notificaciones</h1><div class="card" th:if="${#lists.isEmpty(notificaciones) and #lists.isEmpty(notificacionesAmistad)}">No tienes notificaciones nuevas.</div><article class="notification-card card" th:each="solicitud : ${notificaciones}"><span class="notification-icon">&#128276;</span><div><h2 th:text="${solicitud.estado.name() == 'APROBADA' ? 'Solicitud aceptada' : 'Solicitud rechazada'}">Solicitud actualizada</h2><p>Tu solicitud para <strong th:text="${solicitud.club.nombre}">Club</strong> fue <span th:text="${solicitud.estado.name().toLowerCase()}">aceptada</span>.</p><small th:text="${#temporals.format(solicitud.creadaEn, 'dd/MM/yyyy HH:mm')}">12/11/2026 10:30</small></div></article><article class="notification-card card" th:each="solicitud : ${notificacionesAmistad}"><span class="notification-icon">&#128101;</span><div><h2>Solicitud de amistad aceptada</h2><p><strong th:text="${solicitud.destinatario.nombre}">Usuario</strong> aceptó tu solicitud de amistad.</p><small th:text="${#temporals.format(solicitud.creadaEn, 'dd/MM/yyyy HH:mm')}">12/11/2026 10:30</small></div></article></main></body></html>
