<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendario | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><div class="topbar-actions"><a class="topbar-icon" th:href="@{/notificaciones}">&#128276;</a><a class="profile-chip" th:href="@{/perfil}" title="Perfil"><span class="profile-avatar"><img th:if="${usuarioActual.fotoPerfil}" th:src="${usuarioActual.fotoPerfil}" th:alt="${usuarioActual.nombre}"><span th:unless="${usuarioActual.fotoPerfil}">&#9673;</span></span></a><a th:href="@{/panel}">Panel principal</a></div></header>
<main class="club-main calendar-page"><div class="page-heading"><div><p class="eyebrow">Agenda general</p><h1>Calendario de actividades</h1></div><strong class="calendar-month" th:text="${mesActual}">noviembre 2026</strong></div>
<div class="calendar-weekdays"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span></div>
<div class="calendar-grid"><article class="calendar-day" th:each="dia : ${dias}" th:classappend="${dia.fecha == null ? 'empty-day' : ''}"><span class="day-number" th:if="${dia.fecha != null}" th:text="${dia.fecha.dayOfMonth}">1</span><div class="calendar-event" th:each="actividad : ${dia.actividades}"><strong th:text="${actividad.nombre}">Actividad</strong><small th:text="${actividad.horaInicio + ' · ' + actividad.club.nombre}">10:00 · Club</small></div></article></div></main></body></html>
