<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personas | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><a th:href="@{/panel}">Panel principal</a></header><main class="club-main"><p class="eyebrow">Comunidad universitaria</p><h1>Personas de los clubes</h1><p>Conecta con otros integrantes de los clubes.</p><div class="people-grid"><article class="card person-card" th:each="usuario : ${usuarios}"><div class="profile-avatar"><img th:if="${usuario.fotoPerfil}" th:src="${usuario.fotoPerfil}" th:alt="${usuario.nombre}"><span th:unless="${usuario.fotoPerfil}">&#9673;</span></div><h2 th:text="${usuario.nombre}">Nombre</h2><p th:if="${usuario.descripcion}" th:text="${usuario.descripcion}"></p><form th:action="@{/personas/{id}/solicitar(id=${usuario.id})}" method="post"><button type="submit">Enviar solicitud de amistad</button></form></article></div><section class="card"><h2>Solicitudes recibidas</h2><p th:if="${#lists.isEmpty(solicitudesAmistad)}">No tienes solicitudes pendientes.</p><div class="request-item" th:each="solicitud : ${solicitudesAmistad}" th:if="${solicitud.estado.name() == 'PENDIENTE'}"><strong th:text="${solicitud.solicitante.nombre}">Usuario</strong><div class="request-actions"><form th:action="@{/amistades/{id}/aprobar(id=${solicitud.id})}" method="post"><button type="submit">Aceptar</button></form><form th:action="@{/amistades/{id}/rechazar(id=${solicitud.id})}" method="post"><button class="danger-button" type="submit">Rechazar</button></form></div></div></section></main></body></html>
