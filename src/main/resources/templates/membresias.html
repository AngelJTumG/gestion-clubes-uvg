<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis clubes | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><div class="topbar-actions"><a class="topbar-icon" th:href="@{/notificaciones}">&#128276;</a><a class="profile-chip" th:href="@{/perfil}" title="Perfil"><span class="profile-avatar"><img th:if="${usuarioActual.fotoPerfil}" th:src="${usuarioActual.fotoPerfil}" th:alt="${usuarioActual.nombre}"><span th:unless="${usuarioActual.fotoPerfil}">&#9673;</span></span></a><a th:href="@{/panel}">Panel principal</a></div></header>
<main class="club-main"><p class="eyebrow">Participación estudiantil</p><h1>Clubes a los que pertenezco</h1><div class="card" th:if="${#lists.isEmpty(membresias)}">Aún no perteneces a ningún club.</div>
<div class="card" th:each="membresia : ${membresias}"><h2 th:text="${membresia.club.nombre}">Club</h2><p th:text="${membresia.club.descripcion}">Descripción</p><p>Ingreso: <span th:text="${#temporals.format(membresia.fechaIngreso, 'dd/MM/yyyy')}">12/11/2026</span></p><a class="button" th:href="@{/admin/clubes/{id}(id=${membresia.club.id})}">Ver club</a></div>
<section class="card requests-summary"><h2>Mis solicitudes</h2><p th:if="${#lists.isEmpty(solicitudes)}">No tienes solicitudes registradas.</p><div class="mini-request" th:each="solicitud : ${solicitudes}"><span th:text="${solicitud.club.nombre}">Club</span><strong th:text="${solicitud.estado}">PENDIENTE</strong><small th:text="${#temporals.format(solicitud.creadaEn, 'dd/MM/yyyy HH:mm')}">12/11/2026 10:30</small></div><a class="button secondary" th:href="@{/solicitudes}">Ver todas las solicitudes</a></section></main></body></html>
