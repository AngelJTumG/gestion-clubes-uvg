<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Integrantes | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><div class="topbar-actions"><a class="topbar-icon" th:href="@{/notificaciones}">&#128276;</a><a class="profile-chip" th:href="@{/perfil}" title="Perfil"><span class="profile-avatar"><img th:if="${usuarioActual.fotoPerfil}" th:src="${usuarioActual.fotoPerfil}" th:alt="${usuarioActual.nombre}"><span th:unless="${usuarioActual.fotoPerfil}">&#9673;</span></span></a><a th:href="@{/panel}">Panel principal</a></div></header>
<main class="club-main"><p class="eyebrow" th:text="${club.nombre}">Club</p><h1>Integrantes</h1><div class="card" th:if="${#lists.isEmpty(integrantes)}">Este club todavía no tiene integrantes.</div>
<div class="card" th:each="membresia : ${integrantes}"><h2 th:text="${membresia.estudiante.usuario.nombre}">Nombre</h2><p th:text="${membresia.estudiante.usuario.email}">Correo</p><p>Carné: <span th:text="${membresia.estudiante.carne}">Carné</span> · Ingreso: <span th:text="${#temporals.format(membresia.fechaIngreso, 'dd/MM/yyyy')}">12/11/2026</span></p></div></main></body></html>
