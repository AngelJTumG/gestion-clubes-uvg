<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar club | Clubes UVG</title>
    <link rel="icon" type="image/png" th:href="@{/images/Logo-UVG.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page">
<header class="topbar">
    <div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="Universidad del Valle de Guatemala"><span>Clubes Universitarios</span></div>
    <div class="topbar-actions"><a th:href="@{/panel}">Panel principal</a><form th:action="@{/logout}" method="post"><button type="submit" class="logout-button">Cerrar sesión</button></form></div>
</header>
<main class="club-main">
    <p class="eyebrow">Administración de clubes</p>
    <h1>Agregar club</h1>
    <p class="club-intro">Completa los datos y asigna la cuenta que coordinará el club. Todos los campos son obligatorios.</p>
    <form class="card club-form" th:action="@{/admin/clubes}" th:object="${club}" method="post">
        <div class="alert error" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <div class="club-fields">
            <div>
                <label for="nombre">Nombre del club</label>
                <input type="text" id="nombre" th:field="*{nombre}" maxlength="100" required aria-describedby="nombre-error" th:errorclass="field-invalid">
                <small id="nombre-error" th:errors="*{nombre}"></small>
            </div>
            <div>
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" th:field="*{categoria}" maxlength="100" required aria-describedby="categoria-error" th:errorclass="field-invalid">
                <small id="categoria-error" th:errors="*{categoria}"></small>
            </div>
            <div class="club-wide">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" maxlength="255" required aria-describedby="descripcion-error" th:errorclass="field-invalid" rows="3"></textarea>
                <small id="descripcion-error" th:errors="*{descripcion}"></small>
            </div>
            <div>
                <label for="horario">Horario</label>
                <input type="text" id="horario" th:field="*{horario}" maxlength="100" required aria-describedby="horario-error" th:errorclass="field-invalid">
                <small id="horario-error" th:errors="*{horario}"></small>
            </div>
            <div>
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" th:field="*{ubicacion}" maxlength="100" required aria-describedby="ubicacion-error" th:errorclass="field-invalid">
                <small id="ubicacion-error" th:errors="*{ubicacion}"></small>
            </div>
            <div class="club-wide">
                <label for="requisitos">Requisitos</label>
                <textarea id="requisitos" th:field="*{requisitos}" maxlength="100" required aria-describedby="requisitos-error" th:errorclass="field-invalid" rows="3"></textarea>
                <small id="requisitos-error" th:errors="*{requisitos}"></small>
            </div>
            <div class="club-wide">
                <label for="datosContacto">Datos de contacto</label>
                <textarea id="datosContacto" th:field="*{datosContacto}" maxlength="255" required aria-describedby="datosContacto-error" th:errorclass="field-invalid" rows="3"></textarea>
                <small id="datosContacto-error" th:errors="*{datosContacto}"></small>
            </div>
            <div class="club-wide">
                <label for="coordinadorEmail">Correo del coordinador</label>
                <input type="email" id="coordinadorEmail" th:field="*{coordinadorEmail}" maxlength="150" required aria-describedby="coordinadorEmail-error" th:errorclass="field-invalid">
                <p class="club-help">Usa una cuenta activa con rol ADMIN_CLUB o ADMIN. Puedes utilizar tu propia cuenta de administrador.</p>
                <small id="coordinadorEmail-error" th:errors="*{coordinadorEmail}"></small>
            </div>
        </div>
        <div class="club-actions">
            <button type="submit">Guardar club</button>
            <a class="button secondary" th:href="@{/panel}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
