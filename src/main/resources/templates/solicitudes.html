<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitudes | Clubes UVG</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-page">
<header class="topbar"><div class="brand"><img th:src="@{/images/Logo-UVG.png}" alt="UVG"><span>Clubes Universitarios</span></div><div class="topbar-actions"><a class="topbar-icon" th:href="@{/notificaciones}">&#128276;</a><a class="profile-chip" th:href="@{/perfil}" title="Perfil"><span class="profile-avatar"><img th:if="${usuarioActual.fotoPerfil}" th:src="${usuarioActual.fotoPerfil}" th:alt="${usuarioActual.nombre}"><span th:unless="${usuarioActual.fotoPerfil}">&#9673;</span></span></a><a th:href="@{/panel}">Panel principal</a></div></header>
<main class="club-main"><p class="eyebrow">Mis trámites</p><h1>Estado de solicitudes</h1><div class="card" th:if="${#lists.isEmpty(solicitudes)}">Todavía no has enviado solicitudes.</div>
<div class="card request-card" th:each="solicitud : ${solicitudes}"><h2 th:text="${solicitud.club.nombre}">Club</h2><p>Estado: <strong class="status-pill" th:classappend="${solicitud.estado.name().toLowerCase()}" th:text="${solicitud.estado}">PENDIENTE</strong></p><p class="muted">Enviada el <span th:text="${#temporals.format(solicitud.creadaEn, 'dd/MM/yyyy HH:mm')}">12/11/2026 10:30</span></p></div></main></body></html>
