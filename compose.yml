services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestion_clubes
      MYSQL_USER: clubes
      MYSQL_PASSWORD: clubes123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:

